[package]
name = "airbag-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Undo anything your AI coding agent did to your disk, bash commands included."
license = "MIT"
repository = "https://github.com/wienerlabs/airbag"
readme = "README.md"
keywords = ["ai", "agents", "undo", "snapshot", "claude-code"]
categories = ["command-line-utilities", "filesystem", "development-tools"]

[[bin]]
name = "airbag"
path = "src/main.rs"

[lib]
name = "airbag"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
reflink-copy = "0.1.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.27.0"
